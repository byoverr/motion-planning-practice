[project]
name = "motion-planning-practice"
version = "0.1.0"
description = "Sandbox for practising mobile robot motion planning: TurtleBot3 in a MuJoCo warehouse, global planners (A*, RRT-Connect, BIT*, AIT*) and local planners (DWA, MPPI, Regulated Pure Pursuit)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # MuJoCo stopped shipping Intel-Mac wheels after 3.10; Apple Silicon and Linux get the latest
    "mujoco>=3.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "mujoco>=3.3,<3.11; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pillow>=10",
]

[project.optional-dependencies]
# Reference C++ implementations to compare against (RRTConnect, BITstar, ...).
ompl = ["ompl>=2.0"]

[project.scripts]
mpp = "mpp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# one-off research scripts: closures are used inside the loop that defines them
"scripts/*" = ["B007", "B023", "E501", "SIM115"]
